name: test

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated test names to run (empty = full suite)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.23.x      # oldest supported (see go.mod)
          - oldstable
          - stable
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: lint
        # golangci-lint v2.7 cannot read the export data of the Go release `stable` now resolves to
        if: matrix.go-version != 'stable'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7
          args: --print-resources-usage --timeout=10m --verbose

      - name: Test
        run: |
          {
            if [ -n "${{ inputs.test-filter }}" ]; then
              go test -v -cover "-coverprofile=coverage.txt" -covermode=atomic -run "^($(echo "${{ inputs.test-filter }}" | tr ' ' '|'))$" ./...
            else
              go test -v -cover "-coverprofile=coverage.txt" -covermode=atomic ./...
            fi
          } 2>&1 | tee test-output.txt
          echo "Test summary: $(grep -cE '^[[:space:]]*--- PASS' test-output.txt) passed, $(grep -cE '^[[:space:]]*--- FAIL' test-output.txt) failed, $(grep -cE '^[[:space:]]*--- SKIP' test-output.txt) skipped"
          awk '/^=== (RUN|CONT|NAME) / {cur=$3} /^[[:space:]]+[A-Za-z0-9_]+\.go:[0-9]+: / {m=$0; sub(/^[[:space:]]+/, "", m); msg[cur]=m} /^[[:space:]]*--- SKIP: / {n=$0; sub(/^[[:space:]]*--- SKIP: /, "", n); sub(/ \(.*$/, "", n); print "SKIPPED " n " -- reason: " msg[n]}' test-output.txt
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'

      - name: Test (root)
        if: runner.os == 'Linux'
        run: |
          {
            if [ -n "${{ inputs.test-filter }}" ]; then
              go test -exec "sudo -E -n" -v -cover "-coverprofile=coverage.txt" -covermode=atomic -run "^($(echo "${{ inputs.test-filter }}" | tr ' ' '|'))$" ./...
            else
              go test -exec "sudo -E -n" -v -cover "-coverprofile=coverage.txt" -covermode=atomic ./...
            fi
          } 2>&1 | tee test-output.txt
          echo "Test summary: $(grep -cE '^[[:space:]]*--- PASS' test-output.txt) passed, $(grep -cE '^[[:space:]]*--- FAIL' test-output.txt) failed, $(grep -cE '^[[:space:]]*--- SKIP' test-output.txt) skipped"
          awk '/^=== (RUN|CONT|NAME) / {cur=$3} /^[[:space:]]+[A-Za-z0-9_]+\.go:[0-9]+: / {m=$0; sub(/^[[:space:]]+/, "", m); msg[cur]=m} /^[[:space:]]*--- SKIP: / {n=$0; sub(/^[[:space:]]*--- SKIP: /, "", n); sub(/ \(.*$/, "", n); print "SKIPPED " n " -- reason: " msg[n]}' test-output.txt
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'

  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Create module zip
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/helper" "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/helper"
          go mod init create_mod
          go get golang.org/x/mod@v0.24.0
          cat > main.go <<'GOEOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              f, err := os.Create(os.Args[1])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              mv := module.Version{Path: "github.com/moby/go-archive", Version: "v0.2.0"}
              if err := zip.CreateFromDir(f, mv, os.Args[2]); err != nil {
                  log.Fatal(err)
              }
          }
          GOEOF
          go run . "$RUNNER_TEMP/out/v0.2.0.zip" "$GITHUB_WORKSPACE"
          unzip -l "$RUNNER_TEMP/out/v0.2.0.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.2.0.zip
          if-no-files-found: error
